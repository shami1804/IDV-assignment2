<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Diagrams</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 20px;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

.diagram-section {
  width: 100%;
  margin: 0 auto 35px;
}

.diagram-section h2 {
  text-align: center;
  font-size: 24px;
  font-weight: 600;
  color: #222;
  margin: 0 0 20px;
}

.diagram-container,
.heap-container {
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 20px;
  background: #fff;
  border: 1px solid #d6d6d6;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}

.diagram-container {
  max-width: 1100px;
}

.heap-container {
  max-width: 850px;
}

svg {
  display: block;
  width: 100%;
  height: auto;
}

/* Diagram 001: Concept Map */
.node {
  stroke: #111;
  stroke-width: 1.4;
  cursor: pointer;
  transition: fill 0.2s ease;
}

.root { fill: #e3e3e3; }
.cyan { fill: #00e5e5; }
.pink { fill: #f47388; }
.orange { fill: #ffa45f; }
.green { fill: #75c442; }

.week {
  fill: #fff;
  stroke: #333;
  stroke-width: 1.4;
  cursor: pointer;
  transition: fill 0.2s ease;
}

#conceptMap .node:hover {
  fill: #fff;
}

#conceptMap .week:hover {
  fill: #f0f0f0;
}

.label {
  font-size: 22px;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #111;
  pointer-events: none;
}

.week-label {
  font-size: 19px;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #111;
  pointer-events: none;
}

.relationship {
  font-size: 23px;
  text-anchor: middle;
  fill: #111;
}

.connector {
  fill: none;
  stroke: #222;
  stroke-width: 1.5;
  marker-end: url(#arrowhead);
  pointer-events: none;
}

/* Diagram 002: Binary Heap Tree */
.heap-edge {
  stroke: #222;
  stroke-width: 1.2;
  fill: none;
}

.heap-node {
  fill: #fff;
  stroke: #222;
  stroke-width: 1.2;
  cursor: pointer;
  transition: fill 0.2s ease;
}

#binaryHeap .heap-node:hover {
  fill: #e8e8e8;
}

.heap-value {
  font-size: 16px;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #111;
  pointer-events: none;
}

.heap-index {
  font-size: 15px;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #111;
  pointer-events: none;
}

/* Diagram 004: Recursion Tree */
.recursion-container {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 24px 20px;
  background: #fff;
  border: 1px solid #d6d6d6;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}

#recursionTree {
  display: block;
  width: 100%;
  height: auto;
}

.recursion-line {
  stroke: #222;
  stroke-width: 1.2;
  fill: none;
}

.recursion-dashed {
  stroke-dasharray: 4 4;
}

.recursion-text {
  font-size: var(--base-size, 16px);
  fill: #111;
  font-family: Arial, Helvetica, sans-serif;
  cursor: default;
  transition: font-size 0.15s ease;
}

.recursion-text:hover {
  font-size: calc(var(--base-size, 16px) + 4px);
}

.recursion-label {
  text-anchor: middle;
  dominant-baseline: middle;
}

.recursion-left {
  text-anchor: start;
}

.recursion-right {
  text-anchor: end;
}

.recursion-horizontal {
  stroke: #222;
  stroke-width: 1.2;
  fill: none;
  marker-end: url(#recursionArrow);
}

.recursion-vertical-arrow {
  stroke: #222;
  stroke-width: 1.2;
  fill: none;
  marker-start: url(#recursionArrowUp);
  marker-end: url(#recursionArrow);
}

@media (max-width: 650px) {
  body {
    padding: 16px 10px;
  }

  .diagram-container,
  .heap-container,
  .recursion-container {
    padding: 12px;
    overflow-x: auto;
  }

  #conceptMap {
    min-width: 850px;
  }

  #binaryHeap {
    min-width: 480px;
  }

  #recursionTree {
    min-width: 430px;
  }

  .diagram-section h2 {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<!-- 001 - CONCEPT MAP                             -->
<!-- Diagram section -->

<!-- Diagram section -->
<!-- 002 - BINARY HEAP TREE                        -->
<!-- Diagram section -->

<section class="diagram-section" id="section-002">

  <h2>002 - Binary Heap Tree</h2>

  <div class="heap-container">

    <svg height="369" width="592" id="binaryHeap"
         viewBox="0 0 592 369"
         xmlns="http://www.w3.org/2000/svg"
         role="img"
         aria-label="Binary heap tree with ten indexed nodes">

      <g id="heapEdges" class="heap-edge"></g>

  </div>

<style>
/* Diagram 004 - Recursion Tree */
.recursion-container {
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  padding: 24px;
  background: #fff;

  display: block;

.recursion-text {

  font-size: var(--base-size, 14px);

.recursion-text:hover {

    <svg height="255" width="430" id="recursionTree"

         role="img"
         aria-label="Recursion tree with three vertical c chains">

      <defs>
        <marker id="recArrow"
                markerWidth="6"
                markerHeight="6"
                refX="5"
                refY="3"
                orient="auto"

        <marker id="recArrowUp"
                markerWidth="6"
                markerHeight="6"
                refX="3"
                refY="1"
                orient="0"
                markerUnits="userSpaceOnUse">
          <path d="M0,6 L3,0 L6,6 Z" fill="#222"/>
        </marker>

      </defs>

      <!-- LEFT CHAIN -->
      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="34" y="17">c</text>

      <line class="recursion-line"
            x1="34" y1="28" x2="34" y2="57"/>

      <text class="recursion-text"
            style="--base-size:15px"
            x="12" y="77">T(n-1)</text>

      <!-- MIDDLE CHAIN -->
      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="154" y="17">c</text>

      <line class="recursion-line"
            x1="154" y1="28" x2="154" y2="57"/>

      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="154" y="77">c</text>

      <line class="recursion-line"
            x1="154" y1="88" x2="154" y2="117"/>

      <text class="recursion-text"
            style="--base-size:15px"
            x="133" y="137">T(n-2)</text>

      <!-- RIGHT CHAIN: ROW 1 -->
      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="259" y="17">c</text>

      <line class="recursion-arrow"
            x1="275" y1="17" x2="319" y2="17"/>

      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="340" y="17">c</text>

      <!-- RIGHT CHAIN: ROW 2 -->
      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="259" y="76">c</text>

      <line class="recursion-arrow"
            x1="275" y1="76" x2="319" y2="76"/>

      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="340" y="76">c</text>

      <!-- RIGHT CHAIN: ROW 3 -->
      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="259" y="135">c</text>

      <line class="recursion-arrow"
            x1="275" y1="135" x2="319" y2="135"/>

      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="340" y="135">c</text>

      <!-- DASHED FINAL SEGMENT -->
      <line class="recursion-line recursion-dashed"
            x1="259" y1="146" x2="259" y2="224"/>

      <!-- FINAL ROW -->
      <text class="recursion-text"
            style="--base-size:15px"
            x="246" y="239">T(1)</text>

      <line class="recursion-arrow"
            x1="275" y1="235" x2="319" y2="235"/>

      <text class="recursion-text recursion-center"
            style="--base-size:14px"
            x="340" y="235">c</text>

      <!-- VERTICAL DOUBLE-ARROW AND n LABEL -->
      <line class="recursion-double-arrow"
            x1="369" y1="17" x2="369" y2="235"/>

      <text class="recursion-text recursion-center"
            style="--base-size:15px"
            x="397" y="126">n</text>

    </svg>

  </div>
</section>

<style>
.stack-container {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 24px;
  background: #fff;
  border: 1px solid #d6d6d6;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
}

#stackDiagram {
  display: block;
  width: 100%;
  height: auto;
}

/* Red boxes: no hover effect */

  fill: url(#stackRedGradient);

}

}

  fill: none;
  stroke: #111;
  stroke-width: 1.8;
  marker-end: url(#stackArrowHead);
}

  font-family: Arial, Helvetica, sans-serif;
  font-size: 20px;
  fill: #111;
  cursor: default;
  transition: font-size 0.15s ease;
}

.stack-label:hover {

}

@media (max-width: 650px) {
  .stack-container {
    padding: 12px;
    overflow-x: auto;

  #stackDiagram {

</style>

<style>
  .directed-graph-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    background: #fff;
    border: 1px solid #d6d6d6;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    box-sizing: border-box;
  }

  #directedGraph {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Directed edges */
  .dg-edge {
    fill: none;
    stroke: #111;
    stroke-width: 2.5;
    marker-end: url(#dgArrow);
  }

  /* Plain edges without arrowheads */
  .dg-edge-plain {
    fill: none;
    stroke: #111;
    stroke-width: 2.5;
  }

  /* Vertex circles */
  .dg-vertex {
    fill: #fff;
    stroke: #111;
    stroke-width: 2;
    transition: fill 0.2s ease;
    cursor: pointer;
  }

  .dg-vertex:hover,
  .dg-vertex:has(+ .dg-vertex-label:hover) {
    fill: #e6e6e6;
  }

  /* Vertex labels */
  .dg-vertex-label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 24px;
    text-anchor: middle;
    dominant-baseline: middle;
    fill: #111;
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.2s ease;
  }

  .dg-vertex-label:hover {
    transform: scale(1.12);
  }

  /* Edge labels */
  .dg-edge-label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    text-anchor: middle;
    fill: #111;
    cursor: default;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.2s ease;
  }

  .dg-edge-label:hover {
    transform: scale(1.12);
  }
</style>

<style>
  .linked-list-container {

<script>
(() => {
  const heap = [
    { index: 0, value: 16, x: 326, y: 56 },
    { index: 1, value: 14, x: 200, y: 147 },
    { index: 2, value: 10, x: 470, y: 147 },
    { index: 3, value: 8,  x: 110, y: 232 },
    { index: 4, value: 7,  x: 282, y: 232 },
    { index: 5, value: 9,  x: 402, y: 232 },
    { index: 6, value: 3,  x: 541, y: 232 },
    { index: 7, value: 2,  x: 42,  y: 326 },
    { index: 8, value: 4,  x: 181, y: 326 },
    { index: 9, value: 1,  x: 254, y: 326 }
  ];

  const svgNS = "http://www.w3.org/2000/svg";
  const edges = document.getElementById("heapEdges");
  const nodes = document.getElementById("heapNodes");
  const radius = 27;

  const indexPositions = {
    0: { x: 295, y: 31 },
    1: { x: 170, y: 122 },
    2: { x: 425, y: 137 },
    3: { x: 79,  y: 210 },
    4: { x: 247, y: 210 },
    5: { x: 363, y: 210 },
    6: { x: 505, y: 210 },
    7: { x: 18,  y: 303 },
    8: { x: 142, y: 303 },
    9: { x: 226, y: 303 }
  };

  function createSvgElement(tag, attributes, textContent) {
    const element = document.createElementNS(svgNS, tag);

    Object.entries(attributes).forEach(([key, value]) => {
      element.setAttribute(key, value);
    });

    if (textContent !== undefined) {
      element.textContent = textContent;
    }

    return element;
  }

  heap.forEach(node => {
    if (node.index === 0) return;

    const parentIndex = Math.floor((node.index - 1) / 2);
    const parent = heap[parentIndex];

    const dx = node.x - parent.x;
    const dy = node.y - parent.y;
    const distance = Math.hypot(dx, dy);

    edges.appendChild(createSvgElement("line", {
      x1: parent.x + (dx / distance) * radius,
      y1: parent.y + (dy / distance) * radius,
      x2: node.x - (dx / distance) * radius,
      y2: node.y - (dy / distance) * radius
    }));
  });

  heap.forEach(node => {
    const group = createSvgElement("g", {});
    const labelPosition = indexPositions[node.index];

    group.appendChild(createSvgElement("circle", {
      cx: node.x,
      cy: node.y,
      r: radius,
      class: "heap-node"
    }));

    group.appendChild(createSvgElement("text", {
      x: labelPosition.x,
      y: labelPosition.y,
      class: "heap-index"
    }, node.index));

    group.appendChild(createSvgElement("text", {
      x: node.x,
      y: node.y,
      class: "heap-value"
    }, node.value));

    nodes.appendChild(group);
  });
})();
</script>
